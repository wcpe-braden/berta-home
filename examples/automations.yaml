# --- Sonos grouping -------------------------------------------------------
# NOTE: entity_ids are historical and do NOT match the rooms.
#   media_player.tv_room_tv_room        = Arc  (Living Room)
#   media_player.office_office          = Five (Office)
#   media_player.bedroom_bedroom        = Arc  (Office)      <-- not Bedroom
#   media_player.bedroom_bedroom_2      = Five (Bedroom)
#   media_player.sonos_roam             = Roam (Bathroom)
#   media_player.living_room_move_green = Move (Kitchen)     <-- not Living Room

- id: sonos_group_all
  alias: Sonos - Group all speakers
  description: Join every Sonos to the Living Room Arc.
  triggers:
  - trigger: conversation
    command:
    - Group all speakers
    - Group the speakers
    - Group all the speakers
    - Play everywhere
    - Play in every room
    - Play music everywhere
  conditions: []
  actions:
  - action: media_player.join
    target:
      entity_id: media_player.tv_room_tv_room
    data:
      group_members:
      - media_player.office_office
      - media_player.bedroom_bedroom
      - media_player.bedroom_bedroom_2
      - media_player.sonos_roam
      - media_player.living_room_move_green
  mode: single

- id: sonos_ungroup_all
  alias: Sonos - Ungroup all speakers
  description: Split every Sonos back out to standalone.
  triggers:
  - trigger: conversation
    command:
    - Ungroup all speakers
    - Ungroup the speakers
    - Ungroup everything
    - Split the speakers
    - Stop playing everywhere
  conditions: []
  actions:
  - action: media_player.unjoin
    target:
      entity_id:
      - media_player.office_office
      - media_player.bedroom_bedroom
      - media_player.bedroom_bedroom_2
      - media_player.sonos_roam
      - media_player.living_room_move_green
      - media_player.tv_room_tv_room
  mode: single

- id: sonos_join_office
