# --- Office: music follows presence ---------------------------------------
# One automation with both triggers so a single toggle disables the whole
# behaviour (Settings > Automations > Office - music follows presence).
#
# NOTE: the Office FP300 is the "_2" suffixed entity. The un-suffixed one is
# the Living Room. Counterintuitive, and worth re-checking after any rename.
- id: office_music_presence
  alias: Office - music follows presence
  description: >-
    Starts music when the office is occupied and pauses it ten minutes after
    it empties. The 30s arrival delay filters mmWave false positives (fans,
    passers-by); raise it if the sensor is still twitchy.
  triggers:
  - trigger: state
    entity_id: binary_sensor.presence_multi_sensor_fp300_occupancy_2
    to: 'on'
    for: '00:00:30'
    id: arrived
  - trigger: state
    entity_id: binary_sensor.presence_multi_sensor_fp300_occupancy_2
    to: 'off'
    for: '00:10:00'
    id: left
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: arrived
      - condition: not
        conditions:
        - condition: state
          entity_id: media_player.office_office
          state: playing
      sequence:
      - action: media_player.volume_set
        target:
          entity_id: media_player.office_office
        data:
          volume_level: 0.25
      - action: media_player.play_media
        target:
          entity_id: media_player.office_office
        data:
          media_content_type: favorite_item_id
          media_content_id: FV:2/6
    - conditions:
      - condition: trigger
        id: left
      - condition: state
        entity_id: media_player.office_office
        state: playing
      sequence:
      - action: media_player.media_pause
        target:
          entity_id: media_player.office_office
  mode: single
